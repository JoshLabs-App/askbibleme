name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: 代码地图对齐 + 色彩门禁 + 类型检查 + 测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: 装依赖
        run: npm ci

      - name: 校验代码地图同步
        run: node scripts/gen-code-map.mjs --check

      - name: 校验单一系统色彩总表与零野生色值门禁
        run: npm run check:colors

      - name: 类型检查
        run: |
          node scripts/write-app-build-meta.mjs
          npx --no-install tsc --noEmit

      - name: 单元测试
        run: npm test
