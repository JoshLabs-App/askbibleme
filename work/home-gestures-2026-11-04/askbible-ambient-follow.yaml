appId: me.askbible
---
- launchApp
- tapOn:
    id: home.adjust
- tapOn:
    id: home.ambient.scene-rain
- scrollUntilVisible:
    element:
      id: home.scene.9cc949f2-3c1d-49c0-8357-2dc1d32bd954
    direction: DOWN
- tapOn:
    id: home.scene.3c8150de-7baa-4334-9c89-4042781ced66
- tapOn:
    id: home.scene.9cc949f2-3c1d-49c0-8357-2dc1d32bd954
- scrollUntilVisible:
    element:
      id: home.ambient.scene-water
    direction: UP
- assertVisible:
    id: home.ambient.scene-water
    selected: true
- takeScreenshot: /tmp/askbible-ambient-water-selected
- tapOn:
    id: home.adjust.close
- swipe:
    start: 80%, 52%
    end: 20%, 52%
    duration: 500
- tapOn:
    id: home.adjust
- assertVisible:
    id: home.ambient.scene-rain
    selected: true
- takeScreenshot: /tmp/askbible-ambient-rain-follow
- tapOn:
    id: home.ambient.scene-rain
- tapOn:
    id: home.adjust.close
- swipe:
    start: 20%, 52%
    end: 80%, 52%
    duration: 500
- tapOn:
    id: home.adjust
- assertVisible:
    id: home.ambient.scene-water
    selected: false
- assertVisible:
    id: home.ambient.scene-rain
    selected: false
- takeScreenshot: /tmp/askbible-ambient-off-follow
