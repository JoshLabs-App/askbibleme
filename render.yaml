# AskBible.me 生产（Render Web Service）
# 已有服务不会自动读此文件 — 请在 Dashboard 手动设置：
#   Build Command:  bash scripts/render-build.sh
#   Health Check:   /health  （或 /api/health）
#   NODE_VERSION:   22.22.0  （或与 .node-version 一致）
services:
  - type: web
    name: askbible
    runtime: node
    buildCommand: bash scripts/render-build.sh
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.22.0"
