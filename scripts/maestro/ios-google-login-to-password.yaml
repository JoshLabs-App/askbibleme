appId: me.askbible
---
- launchApp
- openLink: askbible://login
- extendedWaitUntil:
    visible: ".*(使用 Google 继续|Continue with Google|邮箱|Email).*"
    timeout: 60000
- tapOn:
    text: "使用 Google 继续"
    optional: true
- tapOn:
    text: "Continue with Google"
    optional: true
- extendedWaitUntil:
    visible: ".*(使用 Google 账号登录|Sign in with Google|邮箱或电话号码|Email or phone).*"
    timeout: 90000
- tapOn:
    text: "邮箱或电话号码"
    optional: true
- tapOn:
    text: "Email or phone"
    optional: true
- inputText: "josh.zeng.ca@gmail.com"
- tapOn:
    text: "下一步"
    optional: true
- tapOn:
    text: "Next"
    optional: true
- extendedWaitUntil:
    visible: ".*(输入您的密码|Enter your password|密码|Password).*"
    timeout: 60000
- takeScreenshot: google-password-screen
