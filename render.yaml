# AskBible.me 生产（Render Web Service）
# 已有 Web Service 不会自动套用本文件 — 请在 Dashboard 将 Build Command 设为：
#   bash scripts/render-build.sh
services:
  - type: web
    name: askbible
    runtime: node
    buildCommand: bash scripts/render-build.sh
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
