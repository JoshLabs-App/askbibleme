name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run mobile:release:preflight
      - name: Build the Cloudflare Worker locally
        run: |
          npm run prebuild
          npx --no-install tsc --noEmit
          npx --no-install cf build
        env:
          NODE_ENV: production
